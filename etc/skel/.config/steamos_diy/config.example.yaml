# --- GLOBAL ENVIRONMENT VARIABLES ---
# These apply to ALL games unless overridden by a specific game profile.
#
# NOTE: the launcher already enables the universal capabilities (FSR/NIS
# scaling, tearing, dynamic FPS limiter). Declare here only display features
# YOUR panel has, or Steam shows controls that do nothing.
env_vars:
  # --- Per-display capabilities (opt-in — only if your panel supports it) ---
  # STEAM_GAMESCOPE_VRR_SUPPORTED: "1"   # VRR / FreeSync / G-Sync panels
  # STEAM_GAMESCOPE_HDR_SUPPORTED: "1"   # HDR panels (pair with --hdr-enabled)
  # PROTON_ENABLE_HDR: "1"               # Let Proton games output HDR

  # Default performance wrapper applied to all games via sdy (e.g. gamemoderun)
  # Note: MangoHud in Gamescope mode uses the --mangoapp flag, not GAME_WRAPPER
  GAME_WRAPPER: "gamemoderun"

  # Default extra arguments (usually empty for global defaults)
  GAME_EXTRA_ARGS: ""

# --- GLOBAL GAMESCOPE FLAGS ---
# Passed to gamescope in Game Mode. This is a YAML LIST: each item starts
# with a dash "-". Keeping a flag and its value in one item is clearest.
flags:
  - "-W 1280"                # Output width
  - "-H 720"                 # Output height
  - "-r 60"                  # Refresh rate
  - "-F fsr"                 # Upscaling filter
  - "--sharpness 5"          # Sharpness (Value between 0-20)
  - "--rt"                   # Enable Realtime scheduling
  - "--immediate-flips"      # Minimize latency (Low latency/Tearing)

  # --- UX polish (universal, panel-independent) ---
  - "--hide-cursor-delay 3000"   # Hide the mouse cursor after 3s idle

  # --- VRR / MangoHud (recommended for FreeSync/VRR displays) ---
  - "--adaptive-sync"         # Enable VRR/FreeSync at the gamescope level
  - "--mangoapp"              # Native MangoHud overlay (configurable from Steam QAM)

  # --- WRONG SYNTAX (EXAMPLE) ---
  # - "-H" "720"             # ERROR: two quoted strings in one item is invalid YAML

# --- POST-START COMMANDS ---
# Run once, POST_START_DELAY seconds (steamos_diy.conf, default 2.0) after
# gamescope starts — for commands that need its socket (e.g. gamescopectl).
# Split like a shell command line, but no shell runs them: no pipes,
# redirects or $VARIABLES.
post_start_cmds:
  # Keep the --mangoapp overlay from disturbing VRR.
  - "gamescopectl adaptive_sync_ignore_overlay 1"
