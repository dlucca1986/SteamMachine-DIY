# --- GLOBAL ENVIRONMENT VARIABLES ---
# These apply to ALL games unless overridden by a specific game profile.
#
# NOTE: universal session capabilities (FSR/NIS scaling, tearing, dynamic
# FPS limiter, latency tweaks) are provided automatically by the launcher.
# You do NOT need to set them here. Only declare DISPLAY-dependent features
# that match YOUR hardware, or Steam shows controls that do nothing.
env_vars:
  # --- Per-display capabilities (opt-in — only if your panel supports it) ---
  # STEAM_GAMESCOPE_VRR_SUPPORTED: "1"   # VRR / FreeSync / G-Sync panels
  # STEAM_GAMESCOPE_HDR_SUPPORTED: "1"   # HDR panels (pair with --hdr-enabled)
  # PROTON_ENABLE_HDR: "1"               # Let Proton games output HDR

  # Default performance wrapper applied to all games via sdy (e.g. gamemoderun)
  # Note: MangoHud in Gamescope mode uses the --mangoapp flag, not GAME_WRAPPER
  GAME_WRAPPER: "gamemoderun"

  # Default extra arguments (usually empty for global defaults)
  GAME_EXTRA_ARGS: ""

# --- GLOBAL GAMESCOPE FLAGS ---
# These flags define the Steam Game Mode session behavior.
# IMPORTANT: This is a YAML LIST. Each item must start with a dash "-".
flags:
  # --- RIGHT SYNTAX ---
  - "-W 1280"                # Parameter + Value: MUST be in the same quotes
  - "-H 720"                 # Parameter + Value: MUST be in the same quotes
  - "-r 60"                  # Refresh rate: Correct "-r 60"
  - "-F fsr"                 # Upscaling: Correct "-F fsr"
  - "--sharpness 5"          # Sharpness (Value between 0-20)
  - "--rt"                   # Enable Realtime scheduling
  - "--immediate-flips"      # Minimize latency (Low latency/Tearing)

  # --- UX polish (universal, panel-independent) ---
  - "--hide-cursor-delay 3000"   # Hide the mouse cursor after 3s idle

  # --- VRR / MangoHud (recommended for FreeSync/VRR displays) ---
  - "--adaptive-sync"         # Enable VRR/FreeSync at the gamescope level
  - "--mangoapp"              # Native MangoHud overlay (configurable from Steam QAM)

  # --- WRONG SYNTAX (EXAMPLES) ---
  # - -H 720                 # ERROR: Missing quotes
  # - "-H" "720"             # ERROR: Space between quotes breaks the flag
  # - "-H720"                # ERROR: Missing space between flag and value

# --- POST-START COMMANDS ---
# Shell commands executed once after gamescope has started, in a background
# thread. Useful for runtime configuration that requires the gamescope socket
# to be available (e.g. gamescopectl). Each command is fired with spawn_native
# after POST_START_DELAY seconds (configured in steamos_diy.conf, default: 2.0s).
post_start_cmds:
  # Fix erratic VRR behaviour when --mangoapp overlay is active.
  # Without this, the overlay surface interferes with adaptive sync decisions.
  - "gamescopectl adaptive_sync_ignore_overlay 1"
