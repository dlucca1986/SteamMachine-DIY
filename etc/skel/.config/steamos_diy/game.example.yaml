# =============================================================================
# PROJECT:      SteamMachine-DIY - Game Override Examples
# VERSION:      2.1.9
# DESCRIPTION:  Specific Game Configuration (Overrides Global Defaults)
# PHILOSOPHY:   KISS (Keep It Simple, Stupid)
# REPOSITORY:   https://github.com/dlucca1986/SteamMachine-DIY
# PATH:         $HOME/.config/steamos_diy/games.d/game.example.yaml
# DESTINATION:  Managed by Control Center -> games.d/[GameName].yaml
# LICENSE:      MIT
# =============================================================================

# --- [ 🆔 IDENTIFICATION ] ---
# Used by sdy to match this profile to the game. Control Center writes them
# when it creates a profile for a game found by "Scan History".
SDY_ID: 1091500
STEAM_APPID: "1091500"

# --- [ 📘 CONFIGURATION HIERARCHY ] ---
# 1. INHERIT: Commented keys (#) use global values from config.yaml.
# 2. OVERRIDE: Defined keys replace global settings.
# 3. DISABLE: Set to "" to disable a feature for this game.

# --- [ 🚀 HOW TO ACTIVATE ON STEAM ] ---
# 1. Open Steam -> Right Click Game -> Properties
# 2. In 'Launch Options', paste: sdy %command%
# ---------------------------------------

# --- [ ⚙️ EXECUTION OVERRIDES ] ---
GAME_WRAPPER: "mangohud gamemoderun"
GAME_EXTRA_ARGS: ""

# --- [ 🌿 ENVIRONMENT VARIABLES ] ---
# Indent every key under env_vars the same way (2 spaces here).
env_vars:
  PROTON_USE_WINED3D: "1"
  DXVK_HUD: "fps"
  MANGOHUD_CONFIG: "cpu_temp,gpu_temp,fps"  # Valid here because mangohud is in GAME_WRAPPER above

# --- [ ❌ WRONG SYNTAX EXAMPLES ] ---
# DXVK_HUD:"fps"      # ERROR: Missing space after colon
#  DXVK_HUD: "fps"    # ERROR: indented differently from the other keys
# DXVK_ASYNC: true    # WARNING: unquoted true becomes "True"; write "1"
