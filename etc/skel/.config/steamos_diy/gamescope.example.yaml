# =============================================================================
# PROJECT:      SteamMachine-DIY - Gamescope Reference Guide (Updated 2026)
# DESCRIPTION:  Full Gamescope CLI Options translated to YAML
# USAGE:        gamescope [options...] -- [command...]
# =============================================================================

# --- [ GENERAL OPTIONS ] ---
general:
  --help: "show help message"
  -W, --output-width: "output width"
  -H, --output-height: "output height"
  -w, --nested-width: "game width"
  -h, --nested-height: "game height"
  -r, --nested-refresh: "game refresh rate (frames per second)"
  -m, --max-scale: "maximum scale factor"
  -S, --scaler: |
    upscaler type:
    auto, integer, fit, fill, stretch
  -F, --filter: |
    upscaler filter (linear, nearest, fsr, nis, pixel)
    fsr => AMD FidelityFX™ Super Resolution 1.0
    nis => NVIDIA Image Scaling v1.0.3
    pixel => Pixel-perfect scaling
  --sharpness, --fsr-sharpness: "upscaler sharpness from 0 (max) to 20 (min)"
  --expose-wayland: "support wayland clients using xdg-shell"
  -s, --mouse-sensitivity: "multiply mouse movement by given decimal number"
  --backend: |
    select rendering backend:
    auto     => autodetect (default)
    drm      => use DRM backend (standalone display session)
    sdl      => use SDL backend
    openvr   => use OpenVR backend (outputs as a VR overlay)
    headless => use headless backend (no window, no DRM output)
    wayland  => use Wayland backend
  --cursor: "path to default cursor image"
  -R, --ready-fd: "notify FD when ready"
  --rt: "Use realtime scheduling
  -T, --stats-path: "write statistics to path"
  -C, --hide-cursor-delay: "hide cursor image after delay"
  -e, --steam: "enable Steam integration (overlay and features)"
  --xwayland-count: "create N xwayland servers"
  --prefer-vk-device: "prefer Vulkan device for compositing (ex: 1002:7300)"
  --force-orientation: "rotate the internal display (left, right, normal, upsidedown)"
  --force-windows-fullscreen: "force windows inside gamescope to be the size of the nested display"
  --cursor-scale-height: "sets a base output height to linearly scale the cursor against"
  --virtual-connector-strategy: "Specifies how we should make virtual connectors"

# --- [ HDR & PERFORMANCE ] ---
hdr_and_performance:
  --hdr-enabled: |
    enable HDR output (needs Gamescope WSI layer enabled)
    If not set, HDR clients will be tonemapped to SDR.
  --sdr-gamut-wideness: "Set the 'wideness' of the gamut for SDR content (0 - 1)"
  --hdr-sdr-content-nits: "set the luminance of SDR content in nits. Default: 400 nits"
  --hdr-itm-enabled: "enable SDR->HDR inverse tone mapping (SDR input only)"
  --hdr-itm-sdr-nits: |
    luminance of SDR content used as input for ITM process.
    Default: 100 nits, Max: 1000 nits
  --hdr-itm-target-nits: |
    target luminance of the ITM process.
    Default: 1000 nits, Max: 10000 nits
  --framerate-limit: |
    Set framerate limit. Used as a divisor of the refresh rate.
    eg 60 / 59 -> 60fps, 60 / 25 -> 30fps. Default: 0 (disabled)
  --mangoapp: "Launch with the mangoapp (mangohud) performance overlay enabled"
  --adaptive-sync: "Enable adaptive sync if available (VRR - Variable Refresh Rate)"

# --- [ NESTED MODE OPTIONS ] ---
nested_mode:
  -o, --nested-unfocused-refresh: "game refresh rate when unfocused"
  -b, --borderless: "make the window borderless"
  -f, --fullscreen: "make the window fullscreen"
  -g, --grab: "grab the keyboard"
  --force-grab-cursor: "always use relative mouse mode regardless of visibility"
  --display-index: "forces gamescope to use a specific display in nested mode"

# --- [ EMBEDDED MODE OPTIONS ] ---
embedded_mode:
  -O, --prefer-output: "list of connectors (ex: DP-1,HDMI-A-1)"
  --default-touch-mode: "0: hover, 1: left, 2: right, 3: middle, 4: passthrough"
  --generate-drm-mode: "DRM mode generation algorithm (cvt, fixed)"
  --immediate-flips: "Enable immediate flips (may result in tearing)"

# --- [ VR MODE OPTIONS ] ---
vr_mode:
  --vr-overlay-key: "Sets the SteamVR overlay key"
  --vr-app-overlay-key: "Sets the SteamVR overlay key for child apps"
  --vr-overlay-explicit-name: "Force the SteamVR overlay name"
  --vr-overlay-default-name: "Fallback SteamVR overlay name"
  --vr-overlay-icon: "Sets the SteamVR overlay icon file"
  --vr-overlay-show-immediately: "VR overlay takes focus immediately"
  --vr-overlay-enable-control-bar: "Enables control bar features"
  --vr-overlay-enable-control-bar-keyboard: "Enables keyboard button on control bar"
  --vr-overlay-enable-control-bar-close: "Enables close button on control bar"
  --vr-overlay-enable-click-stabilization: "Enables click stabilization in VR"
  --vr-overlay-modal: "Makes VR overlay appear as a modal"
  --vr-overlay-physical-width: "Physical width of VR overlay in metres"
  --vr-overlay-physical-curvature: "Sets the curvature of VR overlay"
  --vr-overlay-physical-pre-curve-pitch: "Sets the pre-curve pitch of VR overlay"
  --vr-scrolls-speed: "Mouse scrolling speed in VR. Default: 8.0"

# --- [ DEBUG & ADVANCED ] ---
debug:
  --disable-layers: "disable libliftoff (hardware planes)"
  --debug-layers: "debug libliftoff"
  --debug-focus: "debug XWM focus"
  --synchronous-x11: "force X11 connection synchronization"
  --debug-hud: "paint HUD with debug info"
  --debug-events: "debug X11 events"
  --force-composition: "disable direct scan-out"
  --composite-debug: "draw frame markers for compositing debug"
  --disable-color-management: "disable color management"
  --disable-xres: "disable XRes for PID lookup"
  --hdr-debug-force-support: "forces HDR support even if display doesn't report it"
  --hdr-debug-force-output: "forces HDR10 PQ output (may look wrong if unsupported)"
  --hdr-debug-heatmap: "displays heatmap of HDR luminance in nits"

# --- [ SHADER & PLATFORM ] ---
shaders_and_platform:
  --reshade-effect: "path: /usr/share/gamescope/reshade/Shaders or ~/.local/share/gamescope/reshade/Shaders"
  --reshade-technique-idx: "sets technique index from reshade effect"
  --mura-map: "Set the mura compensation map path"
  --allow-deferred-backend: "Allows deferred backend initialization"
  --keep-alive: "Keep Gamescope alive if the primary process dies"

# --- [ KEYBOARD SHORTCUTS (SUPER = WIN KEY) ] ---
shortcuts:
  Super + F: "toggle fullscreen"
  Super + N: "toggle nearest neighbour filtering"
  Super + U: "toggle FSR upscaling"
  Super + Y: "toggle NIS upscaling"
  Super + I: "increase FSR sharpness"
  Super + O: "decrease FSR sharpness"
  Super + S: "take a screenshot"
  Super + G: "toggle keyboard grab"
