# =============================================================================
# PROJECT:      SteamOS-DIY - SSOTH (Single Source of Truth)
# VERSION:      1.0.0 - Python
# DESCRIPTION:  Centralized System Identity and Global Paths.
# PHILOSOPHY:   KISS (Keep It Simple, Stupid)
# REPOSITORY:   https://github.com/dlucca1986/SteamMachine-DIY
#
# NOTE:         This is a TEMPLATE. The installer generates the real file
#               at /etc/default/steamos_diy.conf during installation.
# PATH:         /etc/default/steamos_diy.conf
# LICENSE:      MIT
# =============================================================================

# --- System Paths ---
next_session=/var/lib/steamos_diy/next_session

# --- User Configuration (Patched by Installer) ---
user_config={{HOME}}/.config/steamos_diy/config.yaml
games_conf_dir={{HOME}}/.config/steamos_diy/games.d

# --- Binary Handlers ---
bin_gs=/usr/bin/gamescope
bin_steam=/usr/bin/steam
bin_plasma=/usr/bin/startplasma-wayland
bin_dbus=/usr/bin/qdbus6

# --- Logging & Diagnostics ---
# LOG_LEVEL: DEBUG (Verbose), INFO (Standard), ERROR (Critical only)
# Default: INFO. Change to DEBUG for troubleshooting.
LOG_LEVEL=INFO

# --- Performance & Timing ---
# Seconds to monitor a session startup before declaring it stable
# Recommended: 5.0 for slow HDDs/SDDs, 3.0 for fast NVMe
VALIDATION_TIMEOUT=5.0

# Delay in seconds for TTY status messages (0.0 for maximum speed)
NOTIFY_DELAY=0.4

# --- Integration ---
# Logs are routed to systemd-journal.
# View with: journalctl -u steamos_diy.service -f
# Clean with: pkexec journalctl --rotate --vacuum-time=1s
# =============================================================================
