# =============================================================================
# PROJECT:      SteamMachine-DIY - SSoT (Single Source of Truth)
# VERSION:      2.1.9
# DESCRIPTION:  Centralized System Identity and Global Paths.
# PHILOSOPHY:   KISS (Keep It Simple, Stupid)
# REPOSITORY:   https://github.com/dlucca1986/SteamMachine-DIY
#
# NOTE:         This is a TEMPLATE. The installer generates the real file
#               at /etc/default/steamos_diy.conf during installation.
# PATH:         /etc/default/steamos_diy.conf
# LICENSE:      MIT
# =============================================================================

# --- System Paths ---
next_session=/var/lib/steamos_diy/next_session

# --- User Configuration (Patched by Installer) ---
user_config={{HOME}}/.config/steamos_diy/config.yaml
games_conf_dir={{HOME}}/.config/steamos_diy/games.d

# --- Binary Handlers ---
bin_gs=/usr/bin/gamescope
bin_steam=/usr/bin/steam
bin_plasma=/usr/bin/startplasma-wayland
bin_dbus=/usr/bin/qdbus6

# --- Logging & Diagnostics ---
# LOG_LEVEL: DEBUG, INFO (default), WARN or ERROR. DEBUG for troubleshooting.
LOG_LEVEL=INFO

# --- Performance & Timing ---
# Plain numbers only (no units, no comma): a malformed value falls back to
# its built-in default and logs a WARN, it never aborts the session boot.
#
# Seconds a session must stay up after starting to count as stable; if it
# exits sooner, the next start is Desktop (recovery).
VALIDATION_TIMEOUT=5.0

# Seconds the final TTY status message stays before the restart (0 = none)
NOTIFY_DELAY=0.4

# Seconds to wait for SIGTERM before escalating to SIGKILL on session stop
TERM_TIMEOUT=5.0

# Seconds after gamescope starts before post_start_cmds run, so its
# socket is ready for them
POST_START_DELAY=2.0

# --- Backup ---
# Archives kept in ~/.config/steamos_diy/backups/: after each successful
# backup the oldest beyond this count are deleted. 0 keeps everything.
BACKUP_KEEP=5

# --- Integration ---
# Logs go to the systemd journal.
# Session logs:     journalctl -u steamos_diy.service -f
# All project logs: journalctl -t CORE -t STEAM -t SYSTEM -f
# Clean (deletes the WHOLE system journal):
#                   pkexec journalctl --rotate --vacuum-time=1s
# =============================================================================
