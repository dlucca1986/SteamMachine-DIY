[tool.ruff]
line-length = 79

[tool.ruff.lint]
# EXE001 (shebang but not executable): the repo stores the modules as 644;
# install.sh sets +x on deploy, where the shebangs are used (e.g. Steam runs
# /usr/bin/steamos-session-select, a symlink to session_select.py).
ignore = ["EXE001"]

[tool.mypy]
# Default mode (not --check-untyped-defs) on purpose: that flag yields
# dozens of near-noise findings on the unannotated PyQt code in
# control_center.py/editors.py. Default mode checks annotated functions,
# which covers the non-GUI core.
disable_error_code = ["annotation-unchecked"]

[tool.pytest.ini_options]
testpaths = ["usr/local/lib/steamos_diy/tests"]

[tool.pylint.MASTER]
# conftest.py puts the production dir on sys.path at runtime (no package
# layout); pylint needs the same path statically.
#
# Anchored on cwd, not __file__: in init-hook __file__ is pylint's own
# config module, and inserting pylint's package dir (which ships a
# typing.py) shadows the stdlib typing module. cwd covers both documented
# runs: the repo root and usr/local/lib/steamos_diy/tests.
init-hook = "import sys, os; c = os.path.join(os.getcwd(), 'usr/local/lib/steamos_diy'); sys.path.insert(0, c if os.path.isdir(c) else os.path.dirname(os.getcwd()))"

[tool.pylint."MESSAGES CONTROL"]
# - import-error/no-member: astroid doesn't always honour init-hook's
#   sys.path change when resolving a sibling module from a subdirectory
#   (flat, non-package layout); pytest's own real imports are the
#   authoritative check here — every test run exercises them for real.
# - missing-function-docstring: test names are the documentation.
# - protected-access: testing a private helper means calling it by name.
# - import-outside-toplevel: conftest.py fixtures import utils lazily so
#   nothing touches it before the ctypes.CDLL shim is in place.
disable = [
    "import-error",
    "no-member",
    "missing-function-docstring",
    "protected-access",
    "import-outside-toplevel",
]
