[tool.ruff]
line-length = 79

[tool.ruff.lint]
# EXE001 (shebang present but file not executable): every module here is
# imported or launched explicitly via `python3 file.py` (systemd units,
# helper scripts called from other Python, pytest collection) — never
# executed directly as `./file.py`. The shebang is documentation for
# humans, not an execution contract; chmod +x-ing 17 files to satisfy a
# linter would change nothing about how they're actually run.
ignore = ["EXE001"]

# Keep this in sync with pylintrc below if you drop pylint entirely later:
# Ruff's default rule set (E, F) already covers most of what's disabled
# there for style reasons (missing-docstring, protected-access aren't
# checked by Ruff's defaults, so no equivalent disable is needed here).

[tool.pytest.ini_options]
# Migrated from pytest.ini, now deleted — this is the single source of
# truth for pytest config.
testpaths = ["usr/local/lib/steamos_diy/tests"]

[tool.pylint.MASTER]
# Migrated from usr/local/lib/steamos_diy/tests/pylintrc.
# conftest.py adds the parent dir to sys.path at runtime (so `import utils`
# etc. resolve without a package/__init__.py); pylint needs the same hint
# statically or every production-module import here false-positives as
# import-error.
#
# __file__ is NOT usable here: pylint execs init-hook with __file__ bound to
# pylint's OWN config_initialization.py, not to this pyproject.toml. The old
# tests/pylintrc had the same bug — harmless there only because import-error
# is disabled below, so the (never-working) sys.path insert was never
# missed. Once merged into this repo-root config, the bogus path (pylint's
# own package dir, which itself ships a typing.py) landed at the front of
# sys.path and shadowed the stdlib typing module during the *production*
# pylint run, breaking @overload recognition in utils.py. Anchor on cwd
# instead, covering both documented invocations (repo root for the
# production run, usr/local/lib/steamos_diy/tests for the test run).
init-hook = "import sys, os; c = os.path.join(os.getcwd(), 'usr/local/lib/steamos_diy'); sys.path.insert(0, c if os.path.isdir(c) else os.path.dirname(os.getcwd()))"

[tool.pylint."MESSAGES CONTROL"]
# - import-error/no-member: astroid doesn't always honour init-hook's
#   sys.path change when resolving a sibling module from a subdirectory
#   (flat, non-package layout); pytest's own real imports are the
#   authoritative check here — every test run exercises them for real.
# - missing-function-docstring: test names are the documentation
#   (test_write_member_atomically_replaces_existing_file doesn't need a
#   docstring repeating that sentence).
# - protected-access: unit-testing a private helper means calling it by
#   its real (underscore-prefixed) name — that's the point, not a smell.
# - import-outside-toplevel: conftest.py fixtures import utils lazily so
#   nothing touches it before the ctypes.CDLL shim is in place.
disable = [
    "import-error",
    "no-member",
    "missing-function-docstring",
    "protected-access",
    "import-outside-toplevel",
]
